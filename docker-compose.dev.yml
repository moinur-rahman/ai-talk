services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - ai_talk_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - ai_talk_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SEAWEEDFS_MASTER=${SEAWEEDFS_MASTER}
      - SEAWEEDFS_FILER=${SEAWEEDFS_FILER}
      - SEAWEEDFS_VOLUME=${SEAWEEDFS_VOLUME}
      - SEAWEEDFS_PUBLIC_URL=${SEAWEEDFS_PUBLIC_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT}
      - DOMAIN=${DOMAIN}
      - CLIENT_URL=${CLIENT_URL}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - ai_talk_network

  postgres:
    image: postgres:16.4-alpine
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=Asia/Dhaka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_talk_network

  redis:
    image: redis:7.2-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --port ${REDIS_PORT}
      --notify-keyspace-events Exg
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    environment:
      - TZ=Asia/Dhaka
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_talk_network

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "9333:9333"
      - "19333:19333"
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0"
    volumes:
      - ./data/seaweedfs-master:/data
    networks:
      - ai_talk_network

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8080:8080"
      - "18080:18080"
    command: 'volume -mserver="seaweedfs-master:9333" -ip.bind=0.0.0.0 -port=8080'
    volumes:
      - ./data/seaweedfs-volume:/data
    depends_on:
      - seaweedfs-master
    networks:
      - ai_talk_network

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8888:8888"
      - "18888:18888"
    command: 'filer -master="seaweedfs-master:9333" -ip.bind=0.0.0.0'
    volumes:
      - ./data/seaweedfs-filer:/data
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    networks:
      - ai_talk_network

  ollama:
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - ai_talk_network
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  ai_talk_network:
    driver: bridge
